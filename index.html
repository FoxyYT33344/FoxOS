<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FoxOS Admin Edition v1.6.4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            background: #000;
            touch-action: manipulation;
        }

        .admin-glow { box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); }
        .admin-border { border-color: #f97316 !important; }

        @keyframes fox-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spinning-fox { animation: fox-spin 2s linear infinite; font-size: 60px; }

        .desktop-bg { background: linear-gradient(135deg, #0f1923 0%, #1e2d3c 100%); }
        .admin-bg { background: linear-gradient(135deg, #1a0f00 0%, #3d2400 100%) !important; }

        .taskbar {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .window {
            background: #f3f3f3;
            color: black;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            position: absolute;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(0,0,0,0.2);
        }

        .window-header {
            background: #202020;
            color: white;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            touch-action: none;
        }

        .admin-header { background: #f97316 !important; color: black !important; font-weight: bold; }

        #context-menu {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            z-index: 10000;
            width: 240px;
        }

        #uac-overlay { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); z-index: 9999; }
        .progress-fill { height: 100%; background: #f97316; width: 0%; transition: width 0.4s; }

        #start-menu {
            transition: transform 0.3s, opacity 0.2s;
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
        }
        #start-menu.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="h-screen w-screen text-white overflow-hidden" oncontextmenu="return false;" onclick="handleGlobalClick()">

    <div id="context-menu" class="fixed hidden py-1 text-black text-sm shadow-2xl border border-zinc-200">
        <div onclick="executeContextAction('open')" class="px-5 py-4 hover:bg-zinc-100 cursor-pointer flex items-center gap-3 border-b border-zinc-100">
            <span>📂</span> Öffnen
        </div>
        <div id="ctx-admin-btn" onclick="executeContextAction('admin')" class="px-5 py-4 hover:bg-zinc-100 cursor-pointer flex items-center gap-3 font-bold text-orange-600">
            <span>🛡️</span> Superuser Start
        </div>
    </div>

    <div id="uac-overlay" class="fixed inset-0 hidden flex items-center justify-center p-4">
        <div class="bg-white text-black w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden border-4 border-orange-500">
            <div class="p-6 space-y-5 text-center">
                <div class="text-5xl">🛡️</div>
                <h3 class="text-xl font-black uppercase">Admin Zugriff</h3>
                <p id="uac-app-name" class="font-bold text-zinc-600">App Name</p>
                <div class="flex flex-col gap-2">
                    <button id="uac-yes" class="w-full py-4 bg-orange-600 text-white rounded-xl font-bold">Bestätigen</button>
                    <button id="uac-no" class="w-full py-4 bg-zinc-100 text-zinc-400 rounded-xl font-bold">Abbrechen</button>
                </div>
            </div>
        </div>
    </div>

    <div id="setup-wizard" class="fixed inset-0 bg-zinc-900 hidden flex flex-col items-center justify-center p-6 z-[3000]">
        <div id="setup-form" class="max-w-sm w-full space-y-6 text-center">
            <div id="setup-fox" class="text-6xl mb-4">🦊</div>
            <h1 id="setup-title" class="text-3xl font-bold">FoxOS Setup</h1>
            <p id="setup-desc" class="text-sm opacity-60">Gib einen Namen ein oder nutze einen Key.</p>
            <input type="text" id="setup-name" oninput="checkAdminCode(this.value)" placeholder="Benutzername" class="w-full p-4 rounded-xl bg-white/5 border border-white/10 outline-none text-white transition-all focus:border-orange-500">
            <input type="number" id="setup-pin" placeholder="4-stelliger PIN" class="w-full p-4 rounded-xl bg-white/5 border border-white/10 outline-none text-white">
            <button onclick="startInstallation()" class="w-full bg-orange-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">System Initialisieren</button>
        </div>
        <div id="installation-layer" class="hidden max-w-sm w-full text-center space-y-6">
            <h2 id="install-text" class="text-xl font-bold">Kopiere Kernel...</h2>
            <div class="w-full h-2 bg-white/10 rounded-full overflow-hidden">
                <div id="install-progress" class="progress-fill"></div>
            </div>
        </div>
    </div>

    <div id="desktop" class="h-screen w-screen relative hidden desktop-bg" onclick="hideContextMenu()">
        <div id="admin-banner" class="hidden absolute top-0 left-0 w-full py-1 bg-orange-600 text-black text-[9px] font-black text-center uppercase tracking-[0.5em] z-[1000]">
            FoxOS Admin Version freigeschaltet
        </div>

        <div class="p-6 grid grid-cols-4 gap-4 sm:flex sm:flex-col">
            <div onclick="openApp('explorer')" class="flex flex-col items-center p-3 hover:bg-white/10 rounded-xl cursor-pointer">
                <span class="text-4xl">📁</span>
                <span class="text-[10px] mt-1 font-bold">Explorer</span>
            </div>
            <div onclick="openApp('control')" class="flex flex-col items-center p-3 hover:bg-white/10 rounded-xl cursor-pointer">
                <span class="text-4xl">⚙️</span>
                <span class="text-[10px] mt-1 font-bold">System</span>
            </div>
        </div>

        <div id="window-container" class="absolute inset-0 pointer-events-none"></div>

        <div class="taskbar absolute bottom-0 left-0 w-full h-14 flex items-center justify-between px-4 z-[200]">
            <button onclick="toggleStartMenu()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-orange-600/20 text-orange-500">🦊</button>
            <div id="taskbar-time" class="text-[10px] font-bold">00:00</div>
        </div>

        <div id="start-menu" class="absolute bottom-16 left-3 right-3 sm:left-4 sm:w-80 bg-zinc-900 border border-white/10 rounded-3xl p-5 z-[100]">
            <div class="flex items-center gap-4 mb-4 pb-4 border-b border-white/5">
                <div id="menu-avatar" class="w-12 h-12 bg-zinc-800 rounded-full flex items-center justify-center text-xl">👤</div>
                <div id="menu-user" class="font-bold">Admin</div>
            </div>
            <div onclick="logout()" class="p-4 bg-red-500/10 text-red-500 rounded-xl text-center font-bold text-sm">System beenden</div>
        </div>
    </div>

    <script>
        let isAdminVersion = false;
        let users = JSON.parse(localStorage.getItem('FoxUsers')) || [];
        let currentUser = null;

        function checkAdminCode(val) {
            const form = document.getElementById('setup-wizard');
            const title = document.getElementById('setup-title');
            if (val === "FoxyTVVVV") {
                isAdminVersion = true;
                form.classList.add('admin-border');
                title.innerText = "ADMIN EDITION UNLOCKED";
                title.classList.add('text-orange-500');
                document.getElementById('setup-fox').innerText = "⚡🦊⚡";
            } else {
                isAdminVersion = false;
                form.classList.remove('admin-border');
                title.innerText = "FoxOS Setup";
                title.classList.remove('text-orange-500');
                document.getElementById('setup-fox').innerText = "🦊";
            }
        }

        function startInstallation() {
            const name = document.getElementById('setup-name').value;
            const pin = document.getElementById('setup-pin').value;
            if(!name || pin.length < 4) return alert("Daten unvollständig!");

            document.getElementById('setup-form').classList.add('hidden');
            document.getElementById('installation-layer').classList.remove('hidden');
            if(isAdminVersion) document.getElementById('install-text').innerText = "Injektion der Admin-Privilegien...";

            let p = 0;
            const int = setInterval(() => {
                p += 4;
                document.getElementById('install-progress').style.width = p + "%";
                if(p >= 100) {
                    clearInterval(int);
                    users = [{ username: name, pin: pin, isAdmin: true, superuser: isAdminVersion }];
                    localStorage.setItem('FoxUsers', JSON.stringify(users));
                    localStorage.setItem('FoxAdminState', isAdminVersion);
                    location.reload();
                }
            }, 50);
        }

        function initSystem() {
            isAdminVersion = localStorage.getItem('FoxAdminState') === 'true';
            if (users.length === 0) {
                document.getElementById('setup-wizard').classList.remove('hidden');
            } else {
                currentUser = users[0];
                document.getElementById('desktop').classList.remove('hidden');
                if(isAdminVersion) {
                    document.getElementById('desktop').classList.add('admin-bg');
                    document.getElementById('admin-banner').classList.remove('hidden');
                    document.getElementById('menu-avatar').innerText = "⚡";
                    document.getElementById('menu-avatar').classList.add('text-orange-500');
                }
                document.getElementById('menu-user').innerText = currentUser.username + (isAdminVersion ? " (Root)" : "");
                updateClock();
                setInterval(updateClock, 1000);
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('taskbar-time').innerText = now.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
        }

        function openApp(id) {
            if(id === 'explorer') {
                createWindow('exp', 'Explorer' + (isAdminVersion ? ' [ROOT]' : ''), `
                    <div class="p-4">
                        <div class="grid grid-cols-2 gap-2">
                            <div class="p-4 border rounded-xl text-center" onclick="alert('Startet...')">
                                <div class="text-3xl">⚙️</div>
                                <div class="text-[9px] font-bold">FoxOSSteuerung.exe</div>
                            </div>
                            ${isAdminVersion ? `
                            <div class="p-4 border border-orange-500 bg-orange-50 rounded-xl text-center">
                                <div class="text-3xl">🔓</div>
                                <div class="text-[9px] font-bold">System_Bypass.sys</div>
                            </div>` : ''}
                        </div>
                    </div>
                `);
            }
            if(id === 'control') {
                createWindow('ctrl', 'Systemsteuerung', `<div class="p-6">User: ${currentUser.username}<br>Admin-Status: ${isAdminVersion ? 'AKTIVIERT' : 'DEAKTIVIERT'}</div>`);
            }
            hideStartMenu();
        }

        function createWindow(id, title, content) {
            if(document.getElementById(id)) document.getElementById(id).remove();
            const win = document.createElement('div');
            win.id = id;
            win.className = "window pointer-events-auto w-[90vw] sm:w-[400px] h-[300px]";
            win.style.left = "5vw"; win.style.top = "10vh";
            win.style.zIndex = "500";
            win.innerHTML = `
                <div class="window-header ${isAdminVersion ? 'admin-header' : ''}" onmousedown="dragWin(event, '${id}')">
                    <span class="text-[10px]">${title}</span>
                    <button onclick="this.closest('.window').remove()" class="w-6 h-6">✕</button>
                </div>
                <div class="flex-1 bg-white overflow-auto text-black text-sm">${content}</div>
            `;
            document.getElementById('window-container').appendChild(win);
        }

        function dragWin(e, id) {
            const win = document.getElementById(id);
            const move = (ev) => {
                const x = ev.clientX || ev.touches[0].clientX;
                const y = ev.clientY || ev.touches[0].clientY;
                win.style.left = (x - 20) + 'px'; win.style.top = (y - 10) + 'px';
            };
            document.addEventListener('mousemove', move);
            document.addEventListener('mouseup', () => document.removeEventListener('mousemove', move), {once:true});
        }

        function toggleStartMenu() { document.getElementById('start-menu').classList.toggle('open'); }
        function hideStartMenu() { document.getElementById('start-menu').classList.remove('open'); }
        function logout() { localStorage.clear(); location.reload(); }
        function handleGlobalClick() {}
        function hideContextMenu() { document.getElementById('context-menu').classList.add('hidden'); }

        initSystem();
    </script>
</body>
</html>
